<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>portal host harness</title>
<style>
	body { background: #1a1a1a; color: #ccc; font-family: monospace; margin: 12px; }
	iframe { border: 2px solid #444; }
	#gameframe { width: 1000px; height: 750px; }
	#adframe { width: 560px; height: 560px; }
</style>
</head>
<body>
<!-- local approximation of the newgrounds embedding: the game in a CROSS-ORIGIN iframe
     (serve this page from localhost:8080 and the game from 127.0.0.1:8081 - different
     origin, so chrome gives the game its own renderer process like a real portal),
     surrounded by the contention generator like an ad-carrying page.
     usage: http://localhost:8080/host.html
            http://localhost:8080/host.html?game=<encoded game url>
     second server: python -m http.server 8081 --directory <web dir>  -->
<div id="label">portal harness - game iframe is cross-origin, page carries contention</div>
<iframe id="gameframe" allow="autoplay; fullscreen"></iframe>
<iframe id="adframe" src="contention.html"></iframe>
<script>
const params = new URLSearchParams(location.search);
const game = params.get('game') ||
	'http://127.0.0.1:8081/pirootBuild/?nomusic&cvar=webShadowProbe 0;webFlickerMeter 1';
document.getElementById('gameframe').src = game;
document.getElementById('label').textContent = 'portal harness -> ' + game;
</script>
</body>
</html>
